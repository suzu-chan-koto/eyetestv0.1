<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eye Remote</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;width:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f2f3f5;color:#202327}
button{font-family:inherit;touch-action:manipulation}
#app{width:min(100%,430px);margin:auto;padding:max(10px,env(safe-area-inset-top)) 10px max(14px,env(safe-area-inset-bottom))}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
h1{font-size:21px;margin:0}
#status{font-size:10px;color:#777;margin-top:2px}
#connect{border:0;border-radius:10px;padding:9px 12px;background:#24282d;color:#fff;font-weight:800}
.card{background:#fff;border-radius:15px;padding:10px;margin-bottom:8px}
.title{font-size:12px;font-weight:850;color:#62676e;margin-bottom:8px}
.top{display:grid;grid-template-columns:1.15fr .85fr;gap:8px}
.pad{position:relative;width:100%;aspect-ratio:1/1;border:1px solid #d7dade;border-radius:14px;background:linear-gradient(#eceef0 1px,transparent 1px),linear-gradient(90deg,#eceef0 1px,transparent 1px),#fafafa;background-size:25% 25%;overflow:hidden;touch-action:none}
.pad:before,.pad:after{content:"";position:absolute;background:#c9ccd0}
.pad:before{left:50%;top:0;width:1px;height:100%}.pad:after{top:50%;left:0;width:100%;height:1px}
.cursor{position:absolute;left:50%;top:50%;width:19px;height:19px;border-radius:50%;background:#25292e;transform:translate(-50%,-50%);pointer-events:none}
.side{display:grid;gap:6px;align-content:start}.expr{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.btn{border:1px solid #d5d8dc;border-radius:9px;background:#fafafa;min-height:37px;padding:6px 3px;font-size:11px;font-weight:850}
.reactions{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.react{min-height:52px;border:0;border-radius:11px;background:#f0f1f3;color:#202327;font-size:13px;font-weight:850;padding:7px 4px}
.react span{display:block;margin-top:2px;font-size:9px;font-weight:500;color:#777}
.note{font-size:9px;color:#777;text-align:center;margin-top:5px;line-height:1.4}
</style>
</head>
<body>
<div id="app">
  <div class="header">
    <div><h1>👁 Eye Remote</h1><div id="status">未接続</div></div>
    <button id="connect">BLE接続</button>
  </div>

  <div class="card">
    <div class="title">基本操作</div>
    <div class="top">
      <div>
        <div id="pad" class="pad"><div id="cursor" class="cursor"></div></div>
        <div class="note">指で視線を操作</div>
      </div>
      <div class="side">
        <div class="expr">
          <button class="btn" data-cmd="MODE:NORMAL">通常</button>
          <button class="btn" data-cmd="MODE:HALF">半眼</button>
          <button class="btn" data-cmd="MODE:JITO">ジト目</button>
          <button class="btn" data-cmd="MODE:SURPRISE">驚き</button>
        </div>
        <button class="btn" data-cmd="BLINK">まばたき</button>
        <button id="center" class="btn" data-cmd="CENTER">中央リセット</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="title">リアクション</div>
    <div class="reactions">
      <button class="react" data-cmd="REACT:DOUBLE">二度見<span>見て→戻る→もう一度</span></button>
      <button class="react" data-cmd="REACT:PANIC">あわてる<span>高速キョロキョロ</span></button>
      <button class="react" data-cmd="REACT:SURPRISE">びっくり<span>パッと見開く</span></button>
      <button class="react" data-cmd="REACT:SUSPICIOUS">怪しむ<span>ジト目で左右確認</span></button>
      <button class="react" data-cmd="REACT:SLEEPY">眠い<span>半眼からウトウト</span></button>
      <button class="react" data-cmd="REACT:DOZE">居眠り<span>寝落ち→ハッと起きる</span></button>
      <button class="react" data-cmd="REACT:LOOKAROUND">キョロキョロ<span>周囲を見回す</span></button>
      <button class="react" data-cmd="REACT:LOOKAWAY">目をそらす<span>見たあとサッと逸らす</span></button>
      <button class="react" data-cmd="REACT:STARE">ガン見<span>ジト目でじーっと見る</span></button>
      <button class="react" data-cmd="REACT:GROOVE">ノリノリ<span>左右にリズム</span></button>
    </div>
  </div>

  <div class="note">リアクション終了後は開始前の視線位置＋表情へ戻ります。</div>
</div>

<script>
const SERVICE="7d7a0001-7d7a-4a01-9000-123456789abc";
const COMMAND="7d7a0002-7d7a-4a01-9000-123456789abc";
let characteristic=null,device=null,lastSend=0;
const statusEl=document.getElementById("status");

async function connectBLE(){
  try{
    statusEl.textContent="検索中…";
    device=await navigator.bluetooth.requestDevice({filters:[{services:[SERVICE]}]});
    device.addEventListener("gattserverdisconnected",()=>{characteristic=null;statusEl.textContent="切断"});
    const server=await device.gatt.connect();
    const service=await server.getPrimaryService(SERVICE);
    characteristic=await service.getCharacteristic(COMMAND);
    statusEl.textContent="接続済み";
  }catch(e){
    console.error(e);
    statusEl.textContent="接続失敗: "+(e.message||"不明");
  }
}
async function send(cmd){
  if(!characteristic){statusEl.textContent="先にBLE接続";return}
  const data=new TextEncoder().encode(cmd);
  try{
    if(characteristic.writeValueWithoutResponse) await characteristic.writeValueWithoutResponse(data);
    else await characteristic.writeValue(data);
  }catch(e){console.error(e);statusEl.textContent="送信失敗"}
}
document.getElementById("connect").addEventListener("click",connectBLE);
document.querySelectorAll("[data-cmd]").forEach(b=>b.addEventListener("click",()=>send(b.dataset.cmd)));

const pad=document.getElementById("pad"),cursor=document.getElementById("cursor");
function gaze(clientX,clientY){
  const now=performance.now();
  if(now-lastSend<100)return;
  lastSend=now;
  const r=pad.getBoundingClientRect();
  const px=Math.max(0,Math.min(r.width,clientX-r.left));
  const py=Math.max(0,Math.min(r.height,clientY-r.top));
  cursor.style.left=px+"px"; cursor.style.top=py+"px";
  const x=Math.round(30+(px/r.width)*120);
  const y=Math.round(30+(py/r.height)*120);
  send(`XY:${x},${y}`);
}
pad.addEventListener("touchstart",e=>{if(e.touches.length){e.preventDefault();gaze(e.touches[0].clientX,e.touches[0].clientY)}},{passive:false});
pad.addEventListener("touchmove",e=>{if(e.touches.length){e.preventDefault();gaze(e.touches[0].clientX,e.touches[0].clientY)}},{passive:false});
pad.addEventListener("mousedown",e=>{
  gaze(e.clientX,e.clientY);
  const mv=x=>gaze(x.clientX,x.clientY);
  const up=()=>{window.removeEventListener("mousemove",mv);window.removeEventListener("mouseup",up)};
  window.addEventListener("mousemove",mv);window.addEventListener("mouseup",up);
});
document.getElementById("center").addEventListener("click",()=>{cursor.style.left="50%";cursor.style.top="50%"});
</script>
</body>
</html>
