<!DOCTYPE html>
<html lang="ja">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Eye Controller</title>

<style>

body {
  font-family: sans-serif;
  text-align: center;
  background: #f4f4f4;
  padding: 20px;
  user-select: none;
}

button {
  font-size: 18px;
  padding: 14px 25px;
  margin: 10px;
}

#pad {
  width: 300px;
  height: 300px;
  max-width: 85vw;
  max-height: 85vw;

  background: white;

  border: 3px solid #333;
  border-radius: 20px;

  margin: 25px auto;

  position: relative;

  touch-action: none;
}

#cursor {

  position: absolute;

  width: 35px;
  height: 35px;

  border-radius: 50%;
  background: #333;

  left: 50%;
  top: 50%;

  transform: translate(-50%, -50%);
}

#status {
  margin: 15px;
}

</style>

</head>

<body>

<h2>👁 EYE CONTROLLER</h2>

<button onclick="connectBLE()">
Bluetooth接続
</button>

<div id="status">
未接続
</div>

<div id="pad">
  <div id="cursor"></div>
</div>

<p>指で目線を操作</p>

<button onclick="blink()">
まばたき
</button>

<script>

const SERVICE_UUID =
"7d7a0001-7d7a-4a01-9000-123456789abc";

const CHAR_UUID =
"7d7a0002-7d7a-4a01-9000-123456789abc";

let characteristic = null;

async function connectBLE() {

  try {

    const device =
      await navigator.bluetooth.requestDevice({
        filters:[
          {name:"EYE-ATOM"}
        ],
        optionalServices:[
          SERVICE_UUID
        ]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHAR_UUID
      );

    document.getElementById("status")
      .innerText = "接続済み";

  }

  catch(error) {

    document.getElementById("status")
      .innerText = error;

  }
}


async function sendCommand(command) {

  if (!characteristic) return;

  const data =
    new TextEncoder().encode(command);

  try {

    await characteristic.writeValue(data);

  }

  catch(error) {
    console.log(error);
  }
}


const pad =
  document.getElementById("pad");

const cursor =
  document.getElementById("cursor");


function moveEye(event) {

  event.preventDefault();

  const rect =
    pad.getBoundingClientRect();

  let x =
    event.clientX - rect.left;

  let y =
    event.clientY - rect.top;

  x =
    Math.max(0, Math.min(rect.width, x));

  y =
    Math.max(0, Math.min(rect.height, y));

  cursor.style.left = x + "px";
  cursor.style.top  = y + "px";

  // 画面座標 → サーボ角度
  const angleX =
    Math.round(
      30 + (x / rect.width) * 120
    );

  const angleY =
    Math.round(
      30 + (y / rect.height) * 120
    );

  sendCommand("X:" + angleX);
  sendCommand("Y:" + angleY);
}


pad.addEventListener(
  "pointerdown",
  moveEye
);

pad.addEventListener(
  "pointermove",
  event => {

    if (event.buttons ||
        event.pointerType === "touch") {

      moveEye(event);

    }

  }
);


function blink() {

  sendCommand("BLINK");

}

</script>

</body>
</html>
