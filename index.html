<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eye Lid Calibration</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f4f4f4;
  padding: 20px;
  user-select: none;
}

button {
  font-size: 18px;
  padding: 14px 25px;
  margin: 10px;
}

#pad {
  width: 300px;
  height: 300px;
  max-width: 85vw;
  max-height: 85vw;
  background: white;
  border: 3px solid #333;
  border-radius: 20px;
  margin: 25px auto;
  position: relative;
  touch-action: none;
}

#cursor {
  position: absolute;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #333;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

#status {
  margin: 15px;
}

#lidPanel {
  max-width: 420px;
  margin: 30px auto 10px;
  padding: 20px;
  background: white;
  border-radius: 16px;
}

#lidValue {
  font-size: 42px;
  font-weight: bold;
  margin: 10px;
}

#lidSlider {
  width: 100%;
}

.labels {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
}

.note {
  color: #666;
  font-size: 13px;
  margin-top: 12px;
}
</style>
</head>

<body>

<h2>👁 EYE CONTROLLER</h2>

<button id="connectButton">Bluetooth接続</button>
<div id="status">未接続</div>

<div id="pad">
  <div id="cursor"></div>
</div>

<p>指で目線を操作</p>

<div id="lidPanel">
  <h3>まぶた開度</h3>

  <div id="lidValue">75°</div>

  <input
    id="lidSlider"
    type="range"
    min="60"
    max="145"
    value="75"
    step="1"
  >

  <div class="labels">
    <span>もっと開く 60°</span>
    <span>閉じる 145°</span>
  </div>

  <div class="note">
    これまでの通常OPENは75°です。<br>
    60°側は機構に無理がないか確認しながら動かしてください。
  </div>
</div>

<button id="blinkButton">まばたき</button>

<script>

const SERVICE_UUID =
"7d7a0001-7d7a-4a01-9000-123456789abc";

const CHAR_UUID =
"7d7a0002-7d7a-4a01-9000-123456789abc";

let characteristic = null;

let latestX = 90;
let latestY = 90;
let lastSentX = null;
let lastSentY = null;

let isTouching = false;
let xySending = false;

let latestLid = 75;
let lastSentLid = null;
let lidSending = false;

const pad = document.getElementById("pad");
const cursor = document.getElementById("cursor");
const status = document.getElementById("status");
const lidSlider = document.getElementById("lidSlider");
const lidValue = document.getElementById("lidValue");

async function connectBLE() {

  try {

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [
          { name: "EYE-ATOM" }
        ],
        optionalServices: [
          SERVICE_UUID
        ]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHAR_UUID
      );

    status.innerText = "接続済み";

  } catch(error) {

    status.innerText = "接続エラー";
    console.log(error);

  }
}

async function sendCommand(command) {

  if (!characteristic) return;

  const data =
    new TextEncoder().encode(command);

  await characteristic.writeValue(data);
}

function updatePosition(event) {

  event.preventDefault();

  const rect =
    pad.getBoundingClientRect();

  let x =
    event.clientX - rect.left;

  let y =
    event.clientY - rect.top;

  x = Math.max(0, Math.min(rect.width, x));
  y = Math.max(0, Math.min(rect.height, y));

  cursor.style.left = x + "px";
  cursor.style.top  = y + "px";

  latestX =
    Math.round(
      30 + (x / rect.width) * 120
    );

  latestY =
    Math.round(
      30 + (y / rect.height) * 120
    );
}

pad.addEventListener("pointerdown", event => {

  isTouching = true;
  pad.setPointerCapture(event.pointerId);
  updatePosition(event);

});

pad.addEventListener("pointermove", event => {

  if (!isTouching) return;
  updatePosition(event);

});

pad.addEventListener("pointerup", () => {
  isTouching = false;
});

pad.addEventListener("pointercancel", () => {
  isTouching = false;
});

// 目線：10Hz
setInterval(async () => {

  if (!isTouching ||
      !characteristic ||
      xySending) {
    return;
  }

  if (
    latestX === lastSentX &&
    latestY === lastSentY
  ) {
    return;
  }

  xySending = true;

  try {

    await sendCommand(
      "XY:" + latestX + "," + latestY
    );

    lastSentX = latestX;
    lastSentY = latestY;

  } catch(error) {

    console.log(error);

  } finally {

    xySending = false;

  }

}, 100);

// まぶた：スライダー表示は即時
lidSlider.addEventListener("input", () => {

  latestLid =
    Number(lidSlider.value);

  lidValue.innerText =
    latestLid + "°";

});

// BLE送信は20Hzまで
setInterval(async () => {

  if (!characteristic ||
      lidSending ||
      latestLid === lastSentLid) {
    return;
  }

  lidSending = true;

  try {

    await sendCommand(
      "LID:" + latestLid
    );

    lastSentLid = latestLid;

  } catch(error) {

    console.log(error);

  } finally {

    lidSending = false;

  }

}, 50);

document
  .getElementById("blinkButton")
  .addEventListener("click", () => {
    sendCommand("BLINK");
  });

document
  .getElementById("connectButton")
  .addEventListener("click", connectBLE);

</script>

</body>
</html>
