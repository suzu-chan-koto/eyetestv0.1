<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Eye Controller</title>

<style>

body {
  font-family: sans-serif;
  text-align: center;
  background: #f4f4f4;
  padding: 20px;
  user-select: none;
}

button {
  font-size: 18px;
  padding: 14px 25px;
  margin: 10px;
}

#pad {
  width: 300px;
  height: 300px;

  max-width: 85vw;
  max-height: 85vw;

  background: white;

  border: 3px solid #333;
  border-radius: 20px;

  margin: 25px auto;

  position: relative;

  touch-action: none;
}

#cursor {
  position: absolute;

  width: 35px;
  height: 35px;

  border-radius: 50%;
  background: #333;

  left: 50%;
  top: 50%;

  transform:
    translate(-50%, -50%);
}

#status {
  margin: 15px;
}

#debug {
  font-size: 14px;
  color: #666;
  margin-top: 15px;
}

</style>
</head>


<body>

<h2>👁 EYE CONTROLLER</h2>

<button id="connectButton">
Bluetooth接続
</button>

<div id="status">
未接続
</div>


<div id="pad">
  <div id="cursor"></div>
</div>

<p>
指で目線を操作
</p>


<button id="blinkButton">
まばたき
</button>


<div id="debug">
送信レート：10Hz
</div>


<script>

// ==========================================
// BLE
// ==========================================

const SERVICE_UUID =
"7d7a0001-7d7a-4a01-9000-123456789abc";

const CHAR_UUID =
"7d7a0002-7d7a-4a01-9000-123456789abc";


let characteristic = null;


// ==========================================
// Eye position
// ==========================================

let latestX = 90;
let latestY = 90;

let lastSentX = null;
let lastSentY = null;

let isTouching = false;

let sending = false;


// ==========================================
// Elements
// ==========================================

const pad =
  document.getElementById("pad");

const cursor =
  document.getElementById("cursor");

const status =
  document.getElementById("status");

const debug =
  document.getElementById("debug");


// ==========================================
// BLE connect
// ==========================================

async function connectBLE() {

  try {

    const device =
      await navigator.bluetooth.requestDevice({

        filters: [
          {
            name: "EYE-ATOM"
          }
        ],

        optionalServices: [
          SERVICE_UUID
        ]

      });


    const server =
      await device.gatt.connect();


    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );


    characteristic =
      await service.getCharacteristic(
        CHAR_UUID
      );


    status.innerText =
      "接続済み";

  }

  catch(error) {

    status.innerText =
      "接続エラー";

    console.log(error);

  }
}


// ==========================================
// BLE send
// ==========================================

async function sendCommand(command) {

  if (!characteristic) {
    return;
  }


  const data =
    new TextEncoder().encode(
      command
    );


  try {

    await characteristic.writeValue(
      data
    );

  }

  catch(error) {

    console.log(error);

  }

}


// ==========================================
// Pad
// ==========================================

function updatePosition(event) {

  event.preventDefault();


  const rect =
    pad.getBoundingClientRect();


  let x =
    event.clientX -
    rect.left;


  let y =
    event.clientY -
    rect.top;


  x = Math.max(
    0,
    Math.min(
      rect.width,
      x
    )
  );


  y = Math.max(
    0,
    Math.min(
      rect.height,
      y
    )
  );


  // カーソルはリアルタイム表示

  cursor.style.left =
    x + "px";

  cursor.style.top =
    y + "px";


  // 30 ～ 150に変換

  latestX =
    Math.round(
      30 +
      (x / rect.width) *
      120
    );


  latestY =
    Math.round(
      30 +
      (y / rect.height) *
      120
    );

}


// ==========================================
// Pointer
// ==========================================

pad.addEventListener(
  "pointerdown",
  event => {

    isTouching = true;

    pad.setPointerCapture(
      event.pointerId
    );

    updatePosition(
      event
    );

  }
);


pad.addEventListener(
  "pointermove",
  event => {

    if (!isTouching) {
      return;
    }

    updatePosition(
      event
    );

  }
);


pad.addEventListener(
  "pointerup",
  () => {

    isTouching = false;

  }
);


pad.addEventListener(
  "pointercancel",
  () => {

    isTouching = false;

  }
);


// ==========================================
// 10Hz eye transmission
// ==========================================

setInterval(
  async () => {

    if (!isTouching) {
      return;
    }

    if (!characteristic) {
      return;
    }

    // 前回のBLE送信がまだ終わっていたら
    // 新しい命令を送らない
    if (sending) {
      return;
    }


    // 座標が変わっていなければ送らない
    if (
      latestX === lastSentX &&
      latestY === lastSentY
    ) {

      return;

    }


    sending = true;


    try {

      // X/Yを1パケットで送信

      await sendCommand(
        "XY:" +
        latestX +
        "," +
        latestY
      );


      lastSentX =
        latestX;

      lastSentY =
        latestY;


      debug.innerText =
        "10Hz　X:" +
        latestX +
        " Y:" +
        latestY;

    }

    finally {

      sending = false;

    }

  },

  100
);


// ==========================================
// Blink
// ==========================================

document
  .getElementById(
    "blinkButton"
  )
  .addEventListener(
    "click",
    () => {

      sendCommand(
        "BLINK"
      );

    }
  );


document
  .getElementById(
    "connectButton"
  )
  .addEventListener(
    "click",
    connectBLE
  );

</script>

</body>
</html>
