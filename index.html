<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eye Controller</title>

<style>
body {
  font-family: sans-serif;
  text-align: center;
  background: #f4f4f4;
  padding: 20px;
  user-select: none;
}

button {
  font-size: 17px;
  padding: 13px 18px;
  margin: 6px;
}

#pad {
  width: 300px;
  height: 300px;
  max-width: 85vw;
  max-height: 85vw;
  background: white;
  border: 3px solid #333;
  border-radius: 20px;
  margin: 22px auto;
  position: relative;
  touch-action: none;
}

#cursor {
  position: absolute;
  width: 35px;
  height: 35px;
  border-radius: 50%;
  background: #333;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
}

#status {
  margin: 12px;
}

.panel {
  max-width: 430px;
  margin: 18px auto;
  padding: 16px;
  background: white;
  border-radius: 16px;
}

.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.mode {
  background: #eee;
  border: 2px solid transparent;
  border-radius: 12px;
}

.mode.active {
  border-color: #333;
  background: #ddd;
  font-weight: bold;
}

#blinkButton {
  width: min(320px, 85vw);
  font-size: 20px;
}

.note {
  color: #666;
  font-size: 13px;
  margin-top: 8px;
}
</style>
</head>

<body>

<h2>👁 EYE CONTROLLER</h2>

<button id="connectButton">Bluetooth接続</button>
<div id="status">未接続</div>

<div id="pad">
  <div id="cursor"></div>
</div>

<p>指で目線を操作</p>

<div class="panel">

  <h3>まぶたモード</h3>

  <div class="mode-grid">

    <button
      class="mode active"
      data-command="MODE:NORMAL"
      data-name="通常">
      通常
      <br>
      90°
    </button>

    <button
      class="mode"
      data-command="MODE:HALF"
      data-name="半眼">
      半眼
      <br>
      110°
    </button>

    <button
      class="mode"
      data-command="MODE:JITO"
      data-name="ジト目">
      ジト目
      <br>
      125°
    </button>

    <button
      class="mode"
      data-command="MODE:SURPRISE"
      data-name="驚き">
      驚き
      <br>
      65°
    </button>

  </div>

  <div id="modeStatus" class="note">
    現在：通常
  </div>

</div>

<button id="blinkButton">
まばたき
</button>

<div class="note">
  自動まばたき：約2.8〜5.2秒間隔
</div>

<script>

const SERVICE_UUID =
"7d7a0001-7d7a-4a01-9000-123456789abc";

const CHAR_UUID =
"7d7a0002-7d7a-4a01-9000-123456789abc";

let characteristic = null;

let latestX = 90;
let latestY = 90;

let lastSentX = null;
let lastSentY = null;

let isTouching = false;
let xySending = false;

const pad =
  document.getElementById("pad");

const cursor =
  document.getElementById("cursor");

const status =
  document.getElementById("status");

const modeStatus =
  document.getElementById("modeStatus");

async function connectBLE() {

  try {

    const device =
      await navigator.bluetooth.requestDevice({
        filters: [
          { name: "EYE-ATOM" }
        ],
        optionalServices: [
          SERVICE_UUID
        ]
      });

    const server =
      await device.gatt.connect();

    const service =
      await server.getPrimaryService(
        SERVICE_UUID
      );

    characteristic =
      await service.getCharacteristic(
        CHAR_UUID
      );

    status.innerText =
      "接続済み";

  }

  catch(error) {

    status.innerText =
      "接続エラー";

    console.log(error);

  }
}

async function sendCommand(command) {

  if (!characteristic) {
    return;
  }

  const data =
    new TextEncoder().encode(
      command
    );

  await characteristic.writeValue(
    data
  );
}

function updatePosition(event) {

  event.preventDefault();

  const rect =
    pad.getBoundingClientRect();

  let x =
    event.clientX - rect.left;

  let y =
    event.clientY - rect.top;

  x =
    Math.max(
      0,
      Math.min(rect.width, x)
    );

  y =
    Math.max(
      0,
      Math.min(rect.height, y)
    );

  cursor.style.left =
    x + "px";

  cursor.style.top =
    y + "px";

  latestX =
    Math.round(
      30 +
      (x / rect.width) * 120
    );

  latestY =
    Math.round(
      30 +
      (y / rect.height) * 120
    );
}

pad.addEventListener(
  "pointerdown",
  event => {

    isTouching = true;

    pad.setPointerCapture(
      event.pointerId
    );

    updatePosition(event);
  }
);

pad.addEventListener(
  "pointermove",
  event => {

    if (!isTouching) {
      return;
    }

    updatePosition(event);
  }
);

pad.addEventListener(
  "pointerup",
  () => {

    isTouching = false;

  }
);

pad.addEventListener(
  "pointercancel",
  () => {

    isTouching = false;

  }
);

// Eye position: 10 Hz
setInterval(
  async () => {

    if (
      !isTouching ||
      !characteristic ||
      xySending
    ) {
      return;
    }

    if (
      latestX === lastSentX &&
      latestY === lastSentY
    ) {
      return;
    }

    xySending = true;

    try {

      await sendCommand(
        "XY:" +
        latestX +
        "," +
        latestY
      );

      lastSentX =
        latestX;

      lastSentY =
        latestY;

    }

    catch(error) {

      console.log(error);

    }

    finally {

      xySending = false;

    }

  },
  100
);

// Expression buttons
document
  .querySelectorAll(".mode")
  .forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        try {

          await sendCommand(
            button.dataset.command
          );

          document
            .querySelectorAll(".mode")
            .forEach(b => {
              b.classList.remove("active");
            });

          button.classList.add(
            "active"
          );

          modeStatus.innerText =
            "現在：" +
            button.dataset.name;

        }

        catch(error) {

          console.log(error);

        }
      }
    );
  });

// Manual blink
document
  .getElementById(
    "blinkButton"
  )
  .addEventListener(
    "click",
    async () => {

      try {

        await sendCommand(
          "BLINK"
        );

      }

      catch(error) {

        console.log(error);

      }
    }
  );

document
  .getElementById(
    "connectButton"
  )
  .addEventListener(
    "click",
    connectBLE
  );

</script>

</body>
</html>
