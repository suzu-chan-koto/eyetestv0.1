<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0">

<title>
Focus Eye
</title>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background: #f3f3f3;

  color: #222;

}


#app {

  width: min(
    100%,
    430px
  );

  margin: auto;

  padding: 12px;

}


h1 {

  margin:
    4px
    0
    10px;

  font-size: 22px;

}


.card {

  background: white;

  border-radius: 15px;

  padding: 14px;

  margin-bottom: 9px;

}


#connectButton {

  width: 100%;

  padding: 12px;

  border: 0;

  border-radius: 10px;

  background: #222;

  color: white;

  font-size: 16px;

  font-weight: bold;

}


#status {

  margin-top: 7px;

  text-align: center;

  font-size: 12px;

  color: #666;

}


.state {

  display: flex;

  align-items: center;

  gap: 10px;

}


.dot {

  width: 14px;

  height: 14px;

  border-radius: 50%;

  background: #aaa;

}


.dot.on {

  background: #222;

}


#presenceText {

  font-size: 21px;

  font-weight: bold;

}


.label {

  color: #777;

  font-size: 12px;

}


#focusTime {

  margin-top: 3px;

  font-size: 48px;

  font-weight: 800;

  font-variant-numeric:
    tabular-nums;

}


.metrics {

  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 8px;

}


.metric {

  background: #f5f5f5;

  padding: 11px;

  border-radius: 11px;

}


.metricTitle {

  font-size: 11px;

  color: #777;

}


.metricValue {

  margin-top: 4px;

  font-size: 21px;

  font-weight: bold;

}


.actions {

  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 8px;

}


.action {

  padding: 11px 4px;

  border-radius: 10px;

  border: 1px solid #ccc;

  background: white;

  font-size: 14px;

  font-weight: bold;

}


.note {

  text-align: center;

  font-size: 11px;

  color: #777;

  line-height: 1.5;

}

</style>

</head>


<body>


<div id="app">


<h1>
👁 Focus Eye
</h1>


<div class="card">

<button id="connectButton">
Bluetooth接続
</button>

<div id="status">
未接続
</div>

</div>


<div class="card">

<div class="state">

<div
  id="presenceDot"
  class="dot">
</div>

<div id="presenceText">
待機中
</div>

</div>

</div>


<div class="card">

<div class="label">
今回の集中時間
</div>

<div id="focusTime">
00:00
</div>

</div>


<div class="card metrics">

<div class="metric">

<div class="metricTitle">
現在距離
</div>

<div
  id="distance"
  class="metricValue">

--- cm

</div>

</div>


<div class="metric">

<div class="metricTitle">
判定距離
</div>

<div class="metricValue">
80 cm
</div>

</div>

</div>


<div class="card actions">

<button
  id="lookButton"
  class="action">

こっちを見る

</button>


<button
  id="blinkButton"
  class="action">

まばたき

</button>

</div>


<div class="note">

80cm以内に3秒いると計測開始。<br>
5秒以上離れると計測を停止。

</div>


</div>


<script>

const SERVICE_UUID =
"7d7a0001-7d7a-4a01-9000-123456789abc";


const COMMAND_UUID =
"7d7a0002-7d7a-4a01-9000-123456789abc";


const DATA_UUID =
"7d7a0003-7d7a-4a01-9000-123456789abc";


let commandCharacteristic =
  null;


let dataCharacteristic =
  null;


const status =
  document.getElementById(
    "status"
  );


const presenceDot =
  document.getElementById(
    "presenceDot"
  );


const presenceText =
  document.getElementById(
    "presenceText"
  );


const focusTime =
  document.getElementById(
    "focusTime"
  );


const distance =
  document.getElementById(
    "distance"
  );


// ==========================================
// Time formatting
// ==========================================

function formatTime(
  seconds
) {

  seconds =
    Number(seconds) || 0;


  const hour =

    Math.floor(
      seconds / 3600
    );


  const minute =

    Math.floor(
      (seconds % 3600) /
      60
    );


  const second =

    Math.floor(
      seconds % 60
    );


  if (
    hour > 0
  ) {

    return (

      String(hour)
        .padStart(
          2,
          "0"
        )

      + ":" +

      String(minute)
        .padStart(
          2,
          "0"
        )

      + ":" +

      String(second)
        .padStart(
          2,
          "0"
        )

    );
  }


  return (

    String(minute)
      .padStart(
        2,
        "0"
      )

    + ":" +

    String(second)
      .padStart(
        2,
        "0"
      )

  );
}


// ==========================================
// BLE data receiver
// ==========================================

function receiveData(
  event
) {

  const message =

    new TextDecoder()
      .decode(
        event.target.value
      );


  // Example:
  //
  // D:624,P:1,T:182


  const values =
    {};


  message
    .split(",")
    .forEach(
      item => {

        const index =
          item.indexOf(
            ":"
          );


        if (
          index < 0
        ) {

          return;
        }


        const key =
          item.substring(
            0,
            index
          );


        const value =
          item.substring(
            index + 1
          );


        values[key] =
          value;
      }
    );


  // ========================================
  // Distance
  // ========================================

  if (
    values.D !==
    undefined
  ) {

    const mm =
      Number(
        values.D
      );


    distance.textContent =

      Math.round(
        mm / 10
      )

      + " cm";
  }


  // ========================================
  // Presence
  // ========================================

  if (
    values.P !==
    undefined
  ) {

    const present =

      values.P ===
      "1";


    presenceDot
      .classList
      .toggle(
        "on",
        present
      );


    presenceText
      .textContent =

      present ?
      "集中中" :
      "離席中";
  }


  // ========================================
  // Focus time
  // ========================================

  if (
    values.T !==
    undefined
  ) {

    focusTime
      .textContent =

      formatTime(
        values.T
      );
  }
}


// ==========================================
// BLE connect
// ==========================================

async function connectBLE() {

  try {


    const device =

      await navigator
        .bluetooth
        .requestDevice({

          filters: [
            {
              name:
                "FOCUS-EYE"
            }
          ],

          optionalServices: [
            SERVICE_UUID
          ]

        });


    const server =

      await device
        .gatt
        .connect();


    const service =

      await server
        .getPrimaryService(
          SERVICE_UUID
        );


    commandCharacteristic =

      await service
        .getCharacteristic(
          COMMAND_UUID
        );


    dataCharacteristic =

      await service
        .getCharacteristic(
          DATA_UUID
        );


    dataCharacteristic
      .addEventListener(

        "characteristicvaluechanged",

        receiveData

      );


    await dataCharacteristic
      .startNotifications();


    status.textContent =
      "接続済み";

  }


  catch(error) {

    console.log(
      error
    );


    status.textContent =
      "接続エラー";

  }
}


// ==========================================
// BLE command
// ==========================================

async function sendCommand(
  command
) {

  if (
    !commandCharacteristic
  ) {

    return;
  }


  const data =

    new TextEncoder()
      .encode(
        command
      );


  await commandCharacteristic
    .writeValue(
      data
    );
}


// ==========================================
// Buttons
// ==========================================

document
  .getElementById(
    "connectButton"
  )
  .addEventListener(
    "click",
    connectBLE
  );


document
  .getElementById(
    "lookButton"
  )
  .addEventListener(
    "click",
    () => {

      sendCommand(
        "LOOK"
      );

    }
  );


document
  .getElementById(
    "blinkButton"
  )
  .addEventListener(
    "click",
    () => {

      sendCommand(
        "BLINK"
      );

    }
  );

</script>


</body>

</html>
